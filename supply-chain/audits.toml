notes = '''Full first-hand read 2026-09-12 (977 LOC, one file, MIT, BenjaminRi/winresource): a build-script helper that writes a Windows .rc file (version block, string table, icon lines, optional manifest) into OUT_DIR and runs the platform resource compiler, then tells cargo to link the result. No unsafe, no network, no include!. Processes it spawns, all at build time: rc.exe (found via `reg query HKLM\SOFTWARE\Microsoft\Windows Kits\Installed Roots` on an MSVC Windows host) or llvm-rc on a unix cross host, or windres + ar on the GNU toolchain; every path is overridable by the build environment's own variables (RC_PATH, WINDRES, AR, CROSS_COMPILE), the same trust class as CC/AR for cc-rs. Reads CARGO_* build variables and the crate's own Cargo.toml (`[package.metadata.winresource]`, through toml, already in the graph). Writes only under OUT_DIR. Dependency version_check 0.9 (already in the graph) runs `rustc --version` at build time. Used by the six shipped binaries' build.rs to embed packaging/windows/docenta.ico and the version strings; the build script never fails the build when a resource compiler is absent (cosmetic feature; the cross-lint host may lack llvm-rc). Mirrored from the docenta repo supply-chain audit performed by the same auditor/owner.'''

