[[audits.miniz_oxide]]
who = "Robert M1 <50460704+githubrobbi@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.8.9 -> 0.9.1"
notes = "Reviewed full diff (14 files, ~540/185 lines). Crate keeps #![forbid(unsafe_code)]; zero unsafe, build-script, process, network, or filesystem additions. Deflate: new TDEFLFlush modes (Partial/PartialOpt/SyncOpt/NoSync) and unwritten_bit_count; CompressorOxide::with_params clamps level<=10 and window_bits<=15, stores window_bits_max and refuses level raises that would exceed the zlib-header window; block writing skipped for empty blocks unless Finish; SMALL_DIST_EXTRA table shrunk 512->128 with a >>2 index (values are constant per 4-entry group, verified); stored mode no longer feeds the hash chain; several enums gain #[non_exhaustive]. Inflate: decompress_with_limit + OutputBuffer max bound (bytes_left now max-position, i.e. strictly tighter); Huffman table build now rejects over-subscribed tables per step and allows the RFC 1951 single-symbol/empty incomplete tables (matches zlib inftrees.c). Manifest: serde optional dep goes default-features=false + alloc (std feature forwards serde/std), simd-adler32 optional req 0.3.3 -> 0.3.8; no new dependencies."

