notes = "Delta reviewed for the 2026-09-27 dependency refresh (local diff of the crates.io sources, read in full unless noted). FFI calls unchanged, no build.rs change; a poison guard after stream errors, borrowed-dictionary lifetimes, DerefMut removed from AdvancedSeekable (use-after-free, issue #366), the leaked Box on init failure reclaimed, saturating cursor positions. Mirrored from the docenta repo supply-chain audit performed by the same auditor/owner."

[[audits.zstd-safe]]
who = "Robert M1 <50460704+githubrobbi@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "8.0.0 -> 8.1.0"
notes = "Read lib.rs, rust_allocator.rs and seekable.rs in full. New opt-in with-rust-allocator feature routes zstd's ZSTD_customMem through Rust's global allocator: rust_alloc uses checked_add and a fallible Layout (16-byte header holding the size, 16-byte alignment), returns NULL instead of unwinding across FFI, and rust_free rebuilds the identical layout from that header; sound. With the feature off (our build) every context/dictionary constructor is equivalent to 8.0.0. CCtx/DCtx clone now refuses a poisoned context; new try_create_by_reference returns None instead of panicking; two transmutes in seekable.rs become typed pointer casts; WriteBuf's safety contract is now documented. zstd-sys requirement 2.1.0 -> 2.1.1."

[[audits.zstd-sys]]
who = "Robert Nio <50460704+githubrobbi@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "2.0.16+zstd.1.5.7 -> 2.1.0+zstd.1.5.7"
notes = "Delta reviewed for the 2026-09-07 dependency refresh (local diff of the registry sources, 17 files). No file under zstd/lib changed except a packaged libzstd.pc.in; the vendored C sources are identical. build.rs: new opt-in cmake feature (compile_zstd_cmake via the cmake crate, spawns cmake, writes only under OUT_DIR) gated off by default; the default cc path is unchanged except the x86_64 asm file is now only compiled when CARGO_CFG_TARGET_ARCH is x86_64 and -fvisibility=hidden is skipped on msvc (two new cfg env reads); pkg-config probing is skipped under the new empty vendored feature; bindgen leaves the default feature set (the pregenerated src/bindings_*.rs are used and unchanged). Relicensing to BSD-3-Clause. src: the two wasm shim fns become pub unsafe extern C with bodies untouched. No new FFI symbols, no network or out-of-OUT_DIR filesystem access. Mirrored from the docenta repo supply-chain audit performed by the same auditor/owner."

