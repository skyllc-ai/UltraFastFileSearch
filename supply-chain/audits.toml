[[audits.zstd]]
who = "Robert M1 <50460704+githubrobbi@users.noreply.github.com>"
criteria = "safe-to-deploy"
delta = "0.14.0 -> 0.14.2"
notes = "Read every src change; no unsafe added. Decompressor sizes its output from the summed frame content sizes (walked with zstd_safe::find_frame_compressed_size/get_frame_content_size, checked_add, slice get) and errors early with both numbers when the caller's capacity is too small; decode_all pre-reserves from the header's claimed size capped at 32 MiB via fallible try_reserve, so a hostile header cannot force a large allocation; dictionaries gain try_copy/try_new returning io errors instead of panicking; new compress_file/compress_sized helpers wrap existing safe APIs. Cargo.toml adds the with-rust-allocator passthrough feature (off for us) and new test targets."

